[package]
name = "ghost-app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ghost-core = { path = "../../ghost-core" }
ghost-wire = { path = "../../ghost-wire" }
ed25519-dalek = "2"
dirs = "6"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
url = "2"
toml = "0.8"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
cpal = "0.15"
opus = "0.3"
nnnoiseless = "0.5"
rubato = "0.16"
ringbuf = "0.4"
tauri-plugin-global-shortcut = "2"
user-idle = "0.6.0"
aes-gcm = "0.10"
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow"] }
objc2-core-foundation = "0.3"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
