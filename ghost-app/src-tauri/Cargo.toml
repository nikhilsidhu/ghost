[package]
name = "ghost-app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ghost-core = { path = "../../ghost-core" }
ghost-wire = { path = "../../ghost-wire" }
ghost-audio = { path = "../../ghost-audio" }
ghost-devtools = { path = "../../ghost-devtools", optional = true }
ghost-log = { path = "../../ghost-log" }
tracing = "0.1"
ed25519-dalek = "2"
dirs = "6"
gethostname = "1"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt", "net", "io-util"] }
url = "2"
toml = "0.8"
# Not used directly: enables TLS for ghost-core's WebSocket connections (wss relays).
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# The PulseAudio host on Linux, which lists the sound server's own devices by name (ALSA
# shows only its plugins); pure Rust, unlike the PipeWire host.
cpal = { version = "0.18", features = ["pulseaudio"] }
rubato = "0.16"
ringbuf = "0.4"
tauri-plugin-global-shortcut = "2"
user-idle = "0.6.0"
blake3 = "1"
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow"] }
objc2-core-foundation = "0.3"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The audio endpoint notifications; the version cpal already brings. `implement` expands
# to paths in windows-core, so it is a dependency of its own.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# The sound server's device events, and which of its sources are monitors; the version
# cpal already brings.
pulseaudio = "0.3"

[features]
# The profiler window and the timings behind it, for debug builds only (main.rs refuses
# a release build with it). Run with `npm run dev:devtools`.
devtools = ["dep:ghost-devtools", "ghost-core/devtools", "ghost-audio/devtools"]

[dev-dependencies]
# Generates the front end's TypeScript types from the Rust ones (see src/bindings.rs).
ts-rs = "12"

[build-dependencies]
tauri-build = { version = "2", features = [] }
