[package]
name = "ghost-wire"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
thiserror = "1"
ed25519-dalek = "2"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
openmls = { version = "0.8", optional = true }

[features]
# Commit summarising over OpenMLS types, shared by the relay and clients.
mls = ["dep:openmls"]

[dev-dependencies]
serde_json = "1"
