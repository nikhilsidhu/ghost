[workspace]
members = ["ghost-core", "ghost-relay", "ghost-wire", "ghost-media", "ghost-audio", "ghost-devtools", "ghost-log", "ghost-node", "ghost-dev", "ghost-app/src-tauri"]
resolver = "2"

# Voice processing runs in real time even in dev builds: unoptimized, the echo canceller
# alone takes 60% of each 10 ms it processes, and noise suppression 15% of each 20 ms.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3
