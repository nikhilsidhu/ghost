name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Wire, relay, core, media, audio and headless-device tests (unit, integration,
  # scenarios, voice calls, and the process tests that SIGKILL the relay and a device)
  # on every desktop platform.
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The libopus source audiopus_sys bundles asks for a CMake older than 3.5, which
    # CMake 4 configures only with this floor.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # macOS and Windows build libopus from source with the preinstalled cmake.
      - name: Linux libraries (D-Bus and a Secret Service for the keyring, OpenSSL for SQLCipher, Opus for voice, Tauri's for the dev launcher)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev libopus-dev pkg-config gnome-keyring dbus \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # Not yet verified on a Windows machine: SQLCipher links OpenSSL, provided here
      # through vcpkg (preinstalled on GitHub's Windows images).
      - name: Windows OpenSSL for SQLCipher
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
      # The keyring tests store device keys in the OS store; on Linux that is the Secret
      # Service, which needs a D-Bus session and an unlocked keyring.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c "printf ci | gnome-keyring-daemon --unlock --components=secrets && cargo test --workspace --exclude ghost-app"
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude ghost-app

  # The front end's own tests: types against the generated bindings, then Vitest with
  # Tauri's IPC mocked.
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ghost-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The TypeScript types the front end uses are generated from the Rust types the
  # backend sends; fail if the committed ones are out of date.
  bindings:
    name: Generated TypeScript bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri and audio build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libssl-dev libopus-dev libxdo-dev libxss-dev pkg-config
      # With devtools on, so the profiler's types are covered too, and the dev launcher's.
      - name: Regenerate
        run: |
          cargo test -p ghost-app --features devtools bindings
          cargo test -p ghost-dev bindings
      - name: Compare with the committed files
        run: git diff --exit-code -- ghost-app/src/lib/generated ghost-app/src/launcher/generated

  # The desktop app driven through its interface (ghost-node/tests/ui.rs), with headless
  # devices as the other people: Linux only, where tauri-driver runs, under Xvfb.
  ui:
    name: UI smoke tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ghost-app/package-lock.json
      - name: Tauri, WebKit WebDriver and display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libssl-dev libopus-dev libxdo-dev libxss-dev pkg-config \
            webkit2gtk-driver xvfb dbus dbus-x11
      - run: cargo install tauri-driver --locked
      # A debug build with the front end embedded, as the tests launch it.
      - name: Build the app
        working-directory: ghost-app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Test
        env:
          GHOST_UI_APP: ${{ github.workspace }}/target/debug/ghost-app
          GHOST_UI_ARTIFACTS: ${{ github.workspace }}/ui-failures
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p ghost-node --test ui -- --ignored --test-threads=1
      - name: Screenshots of what the app showed when a test gave up
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failures
          path: ui-failures
          if-no-files-found: ignore
