[package]
name = "ghost-media"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

# The media session of a call, without codecs or devices: transport and binds, frame
# encryption, and the track interface codec crates implement. Keys come from the
# caller, so OpenMLS and storage stay out.

[dependencies]
ghost-wire = { path = "../ghost-wire" }
sframe = { version = "2.0", default-features = false, features = ["rust-crypto"] }
thiserror = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
rand = "0.8"
tracing = "0.1"

[features]
# A lossy-network forwarder for tests of whatever runs over the session.
test-util = []
# Tracing spans and the processing-load timer for the dev builds' performance tooling.
devtools = []

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
