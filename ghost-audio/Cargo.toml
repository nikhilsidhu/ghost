[package]
name = "ghost-audio"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

# A call's audio track: echo cancellation, noise suppression, voice activity, volume
# normalization, Opus, jitter buffers, mixing. Devices plug in through a 48 kHz mono
# interface, so the app brings real ones and tests bring synthetic ones.

[dependencies]
ghost-media = { path = "../ghost-media" }
ghost-wire = { path = "../ghost-wire" }
opus = "0.3"
nnnoiseless = "0.5"
# WebRTC's echo canceller (AEC3) and volume normalizer (AGC2), ported to Rust.
sonora = "0.2"
# Lock-free queues between the audio thread and the device's playback thread.
ringbuf = "0.4"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[features]
# Synthetic devices: a tone generator for capture and a recorder for playback.
test-util = []
# Per-stream call figures for the dev builds' profiler.
devtools = ["ghost-media/devtools"]
