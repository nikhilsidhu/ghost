[package]
name = "ghost-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Linux: the kernel keyring alone is lost at reboot, so it only caches entries kept in the
# desktop Secret Service; crypto-rust encrypts them on the D-Bus session.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_sqlite_storage = "0.2"
openmls_traits = "0.5"
serde = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
rand = "0.8"
thiserror = "1"
hex = "0.4"
zeroize = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "time"] }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
futures-util = "0.3"
serde_json = "1"
ghost-wire = { path = "../ghost-wire", features = ["mls"] }
ghost-media = { path = "../ghost-media" }
tracing = "0.1"

[features]
# Tracing spans on MLS operations, relay calls and the session and voice loops, for the
# dev builds' performance tooling (ghost-devtools). Off, none of it is compiled in.
devtools = ["ghost-media/devtools"]

[dev-dependencies]
tempfile = "3"
ghost-relay = { path = "../ghost-relay", features = ["test-util"] }
ghost-log = { path = "../ghost-log" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
