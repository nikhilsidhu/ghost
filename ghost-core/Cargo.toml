[package]
name = "ghost-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
blake3 = "1"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
